<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Technical Situation | System Modules</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --accent-tech: #4285f4;
            --code-bg: #1e1e1e;
            --panel-bg: #121212;
            --border-color: #2a2a2a;
        }

        body { background: #050505; color: #ccc; margin: 0; font-family: 'Courier New', Courier, monospace; }

        .main-nav { 
            padding: 15px 30px; 
            background: #000; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between;
            font-family: sans-serif;
        }
        .main-nav a { color: #888; text-decoration: none; font-size: 0.85rem; letter-spacing: 1px; }

        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }

        .page-header { margin-bottom: 40px; border-left: 2px solid var(--accent-tech); padding-left: 20px; }
        .page-header h1 { font-size: 2.2rem; color: #fff; margin: 0; font-family: sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .page-header p { color: #555; font-family: sans-serif; margin-top: 5px; }

        /* --- ACCORDION SYSTEM --- */
        .accordion-item {
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            border-radius: 4px;
            overflow: hidden;
            background: var(--panel-bg);
        }

        .accordion-header {
            width: 100%;
            padding: 18px 25px;
            background: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            transition: background 0.2s;
        }

        .accordion-header:hover { background: #222; }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .active .status-dot { background: var(--accent-tech); box-shadow: 0 0 8px var(--accent-tech); }

        .header-left h3 { 
            margin: 0; 
            color: #eee; 
            font-family: sans-serif; 
            font-size: 1.1rem; 
            font-weight: 400;
        }

        .toggle-icon { color: #555; font-size: 1.2rem; transition: transform 0.3s; }
        .active .toggle-icon { transform: rotate(45deg); color: var(--accent-tech); }

        /* --- CONTENT AREA --- */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--code-bg);
        }

        .accordion-item.active .accordion-content {
            max-height: 600px; /* High enough to fit code + bar */
        }

        .code-window {
            padding: 25px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #d4d4d4;
            border-bottom: 1px solid var(--border-color);
        }

        /* Syntax Highlighting */
        .code-keyword { color: #569cd6; }
        .code-func { color: #dcdcaa; }
        .code-string { color: #ce9178; }
        .code-comment { color: #6a9955; }

        .action-bar {
            padding: 15px 25px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .desc-text { font-family: sans-serif; font-size: 0.8rem; color: #777; max-width: 60%; }

        .colab-btn {
            background: transparent;
            color: #fff;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #444;
            transition: 0.3s;
        }

        .colab-btn:hover {
            border-color: var(--accent-tech);
            background: rgba(66, 133, 244, 0.1);
        }
    </style>
</head>
<body class="practical-body">
    <nav class="main-nav" style="background: transparent; border-color: #222;">
        <a href="https://jfforero.github.io/The-Ironic-Machines/" style="color: #888;">← Back to Menu</a>
        <span style="color: var(--accent-art);">Gallery / Artistic Iterations</span>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1>The Practical Situation</h1>
            <p>9 Experimental layers of emotional manifestation.</p>
        </header>

        <section class="art-grid" id="art-grid"></section>
    </div>

    <script>
        // ... (Keep your existing iterations array) ...

        const grid = document.getElementById('art-grid');
        iterations.forEach((item, i) => {
            grid.innerHTML += `
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="art-link">
                    <div class="art-card">
                        <div class="art-number">0${i+1}</div>
                        <div class="art-placeholder">
                            <div class="glitch-box"></div>
                            <span class="view-label">ENTER_EXPERIENCE</span>
                        </div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                </a>`;
        });
    </script>
</body>
</html>
