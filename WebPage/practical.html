<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Practical Situation | Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
<style>
    /* Fix for the "Half Canvas" / Layout issue */
    .art-placeholder {
        position: relative;
        width: 100%;
        height: 250px; /* Adjust based on your design */
        background: #111;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .art-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensures the image fills the area without distorting */
        opacity: 0.8;
        transition: transform 0.5s ease, opacity 0.3s ease;
    }

    .art-card:hover .art-placeholder img {
        opacity: 1;
        transform: scale(1.05);
    }

    /* Styling for the View Label overlay */
    .view-label {
        position: absolute;
        z-index: 2;
        background: rgba(0,0,0,0.7);
        padding: 5px 10px;
        font-size: 0.7rem;
    }
</style>
</head>

<body class="practical-body">

    <nav class="main-nav" style="background: transparent; border-color: rgba(255,255,255,0.1);">
        <a href="https://jfforero.github.io/The-Ironic-Machines/" style="color: #888;">← RETURN_TO_MENU</a>
        <span style="color: var(--accent-art); letter-spacing: 2px; font-size: 0.8rem;">GALLERY // ARTISTIC_ITERATIONS</span>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1>The Practical Situation</h1>
            <p>9 Experimental layers of emotional manifestation.</p>
        </header>

        <section class="art-grid" id="art-grid"></section>
    </div>

    <script>
/** * NOTE: If your HTML file is inside the "WebPage" folder alongside the images, 
 * use "01.png". If the HTML is one folder up, use "WebPage/01.png".
 */
const iterations = [
    { title: "What Stirs Within", desc: "Iteration 01: Web-based affective audio synthesis.", url: "https://github.com/jfforero/The-Ironic-Machines/tree/main/What_Stirs_Within", thumb: "WebImages/01.png" },
    { title: "A Máquina Sensível", desc: "Iteration 02: Unity3D voice-command system.", url: "https://jfforero.itch.io/ams", thumb: "WebImages/02.png" },
    { title: "Abandoned Memories", desc: "Iteration 03: Speech-guided neural style transfer.", url: "https://emotional-machines.com/poetry/abandoned-memories/", thumb: "WebImages/03.png" },
    { title: "Veintitantos Vientos", desc: "Iteration 04: Spatial reconfiguration via utterances.", url: "https://emotional-machines.com/veintitantos-vientos/", thumb: "WebImages/04.png" },
    { title: "En train d’oublier", desc: "Iteration 05: Dynamic landscapes and memory.", url: "https://territoriosvirtuales.wordpress.com/1889/10/30/_en-train-doublier_/", thumb: "WebImages/05.png" },
    { title: "Terra Australis Ignota", desc: "Iteration 06: Speculative cartography.", url: "https://territoriosvirtuales.wordpress.com/1570/05/20/terra-australis-ignota/", thumb: "WebImages/06.png" },
    { title: "What Space", desc: "Iteration 07: Semantic vs. acoustic ambiguity.", url: "https://territoriosvirtuales.wordpress.com/2024/09/18/the-what-space/", thumb: "WebImages/07.png" },
    { title: "The Ironic Machine[s]", desc: "Iteration 08: Sarcasm and kindness environments.", url: "https://jfforero.github.io/TheIronicMachine/index.html", thumb: "WebImages/08.png" },
    { title: "Bello", desc: "Iteration 09: Final synthesis at Igreja da Sé.", url: "https://emotional-machines.com/poetry/bello/", thumb: "WebImages/09.png" }
];

const grid = document.getElementById('art-grid');

iterations.forEach((item, i) => {
    grid.innerHTML += `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="art-link">
            <div class="art-card">
                <div class="art-number">0${i+1}</div>
                <div class="art-placeholder">
                    <img src="${item.thumb}" alt="${item.title}" onerror="this.src='https://picsum.photos/seed/error/600/400'">
                    <div class="glitch-box"></div>
                    <span class="view-label">VIEW_ARTIFACT</span>
                </div>
                <h3 style="font-family: 'Playfair Display', serif; margin-top: 15px;">${item.title}</h3>
                <p>${item.desc}</p>
            </div>
        </a>`;
});
</script>
</body>
</html>
