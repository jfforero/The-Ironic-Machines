<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Practical Situation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="main-nav">
        <a href="https://jfforero.github.io/The-Ironic-Machines/">← Back to Menu</a>
        <span>Gallery / Artistic Iterations</span>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1>The Practical Situation</h1>
            <p>9 Experimental layers of emotional manifestation.</p>
        </header>

        <section class="art-grid" id="art-grid"></section>
    </div>

    <script>
        const iterations = [
            "Chromotherapy Chamber", "Frequency Resonance", "Non-Linear Narrative",
            "Biometric Sculpture", "Echoes of Sarcasm", "Neural Soundscapes",
            "The Empathic Room", "Subliminal Geometry", "Final Synthesis"
        ];
        
        const grid = document.getElementById('art-grid');
        iterations.forEach((title, i) => {
            grid.innerHTML += `
                <div class="art-card">
                    <div class="art-number">0${i+1}</div>
                    <div class="art-placeholder">ITERATION_IMAGE_${i+1}</div>
                    <h3>${title}</h3>
                </div>`;
        });
    </script>
</body>
</html>
